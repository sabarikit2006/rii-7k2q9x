stomer may be allowed until the middle of the next month. If that period is exceeded, we may void and reissue. The displayed due date and the allowed collection period are not always the same thing."},{"speaker":"Team member C","starts_at_seconds":593.9626,"timecode":"00:09:53","text":"Understood. That explains why the invoice month alone does not tell us when the cash arrived."},{"speaker":"Team member A","starts_at_seconds":596.86,"timecode":"00:09:56","text":"You can add a one-time customisation line as well as the subscription. If only half is being collected upfront, the invoice should describe that instalment instead of making it look like the whole charge."},{"speaker":"Team member A","starts_at_seconds":641.01,"timecode":"00:10:41","text":"The tax presentation can be one integrated line or split components depending on the entity information. The demonstration changes when I update that field. This is part of the configuration the operations team needs to get right."},{"speaker":"Team member A","starts_at_seconds":787.86194,"timecode":"00:13:07","text":"After the first payment, we configure the billing cycle for the account. Monthly, quarterly and annual customers do not all receive the same subscription charge every month."},{"speaker":"Team member A","starts_at_seconds":902.89197,"timecode":"00:15:02","text":"You will also see zero-value invoices. If a periodic invoice has no subscription charge due and no extra usage component, its value can be zero. That is not automatically a missing payment."},{"speaker":"Team member A","starts_at_seconds":948.33203,"timecode":"00:15:48","text":"For the automated engine, invoice generation is at midnight in the customer's local time, with a later scheduled attempt to deduct the balance. Manual invoices are separate. There is a gap between generating an invoice and clearing it."},{"speaker":"Team member A","starts_at_seconds":948.33203,"timecode":"00:15:48","text":"Suppose the invoice is INR 6,240 but the wallet contains INR 6,110. The deduction fails and a notification goes out. The system tries three times. Adding money afterwards does not mean it was available when that earlier attempt happened."},{"speaker":"Team member A","starts_at_seconds":1144.893,"timecode":"00:19:04","text":"On the third day it tries again, but spending may have reduced the wallet balance. The next attempt can fail too. It repeats on the seventh day, now with a warning that another failure will freeze the account. The account manager receives the notices and can follow up before that point."},{"speaker":"Team member A","starts_at_seconds":1224.2269,"timecode":"00:20:24","text":"On the tenth day, if there is enough money, the invoice clears and the next billing date moves forward. If it still fails, payments and cards can be blocked, and the billing date stays stuck. Simply topping up a frozen account does not complete the whole recovery flow in this process."},{"speaker":"Team member A","starts_at_seconds":1224.2269,"timecode":"00:20:24","text":"The customer must tell us, then operations clears the outstanding invoice and unfreezes the account. Operations also needs to adjust the next billing date manually. Clearing the payment without checking that date can leave the next cycle wrong."},{"speaker":"Team member B","starts_at_seconds":1364.9149,"timecode":"00:22:44","text":"No further question from me on that part."},{"speaker":"Team member A","starts_at_seconds":1366.467,"timecode":"00:22:46","text":"I will request the back-office access separately for the next training session. If questions come up when you review the billing examples, send them over and we will take them up."}],"unavailable_reason":null}},{"record_ref":"M11","source_type":"meeting","source_id":"fc651475-187c-5882-a644-b501408e8647","payload":{"id":"fc651475-187c-5882-a644-b501408e8647","title":"Internal design discussion","starts_at":"2026-08-21T11:30:00Z","ends_at":"2026-08-21T12:30:00Z","duration_seconds":194,"provider":"google_meet","join_url":"https://meet.example.invalid/fc651475-187c-5882-a644-b501408e8647","organizer_email":"team13@example.com","attendee_count":1,"recording_status":"recorded","recording_detail":null,"recording_id":"ac65ee6e-a1a5-5827-9320-b1c0c7cd002c","has_transcript":true,"has_video":true,"summary":null,"summary_status":"stored","redacted":true},"transcript_payload":{"meeting_id":"fc651475-187c-5882-a644-b501408e8647","turns":[],"unavailable_reason":"The meeting was recorded but nobody spoke."}},{"record_ref":"M12","source_type":"meeting","source_id":"c759b921-e9d3-540c-a06b-474c5710342d","payload":{"id":"c759b921-e9d3-540c-a06b-474c5710342d","title":"SpendNest setup - Sample account","starts_at":"2026-08-21T14:30:00Z","ends_at":"2026-08-21T15:00:00Z","duration_seconds":1800,"provider":"google_meet","join_url":"https://meet.example.invalid/c759b921-e9d3-540c-a06b-474c5710342d","organizer_email":"arun@example.com","attendee_count":1,"recording_status":"cancelled","recording_detail":"The notetaker was cancelled before the meeting started.","recording_id":null,"has_transcript":false,"has_video":false,"summary":null,"summary_status":null,"redacted":true},"transcript_payload":{"meeting_id":"c759b921-e9d3-540c-a06b-474c5710342d","turns":[],"unavailable_reason":"The notetaker was cancelled before the meeting started."}},{"record_ref":"M13","source_type":"meeting","source_id":"794a9d1c-889d-5957-873f-8a1271b03455","payload":{"id":"794a9d1c-889d-5957-873f-8a1271b03455","title":"SpendNest \u003c> Cedarwave Distribution - Migration discussion","starts_at":"2026-08-21T08:30:00Z","ends_at":"2026-08-21T09:30:00Z","duration_seconds":3600,"provider":"google_meet","join_url":"https://meet.example.invalid/794a9d1c-889d-5957-873f-8a1271b03455","organizer_email":"team09@example.com","attendee_count":1,"recording_status":"not_scheduled","recording_detail":"No notetaker was ever scheduled for this meeting.","recording_id":null,"has_transcript":false,"has_video":false,"summary":null,"summary_status":null,"redacted":true},"transcript_payload":{"meeting_id":"794a9d1c-889d-5957-873f-8a1271b03455","turns":[],"unavailable_reason":"No notetaker was ever scheduled for this meeting."}},{"record_ref":"M14","source_type":"meeting","source_id":"93f4867d-65cd-5236-bc55-7bd57df8ac24","payload":{"id":"93f4867d-65cd-5236-bc55-7bd57df8ac24","title":"CRM demonstration","starts_at":"2026-08-21T07:30:00Z","ends_at":"2026-08-21T08:30:00Z","duration_seconds":3600,"provider":"google_meet","join_url":"https://meet.example.invalid/93f4867d-65cd-5236-bc55-7bd57df8ac24","organizer_email":"team14@example.com","attendee_count":4,"recording_status":"cancelled","recording_detail":"The notetaker was cancelled before the meeting started.","recording_id":null,"has_transcript":false,"has_video":false,"summary":null,"summary_status":null,"redacted":true},"transcript_payload":{"meeting_id":"93f4867d-65cd-5236-bc55-7bd57df8ac24","turns":[],"unavailable_reason":"The notetaker was cancelled before the meeting started."}}]},"update":{"batch_id":"update-002","revision":2,"exported_at":"2026-08-22T10:00:00+05:30","records":[{"record_ref":"M07","source_type":"meeting","source_id":"4f304fff-fd40-5cfc-a366-0a134c445c2a","payload":{"id":"4f304fff-fd40-5cfc-a366-0a134c445c2a","title":"Willowfield Trust / SpendNest discussion","starts_at":"2026-08-21T05:30:00Z","ends_at":"2026-08-21T06:30:00Z","duration_seconds":1236,"provider":"google_meet","join_url":"https://meet.example.invalid/4f304fff-fd40-5cfc-a366-0a134c445c2a","organizer_email":"team09@example.com","attendee_count":1,"recording_status":"recorded","recording_detail":null,"recording_id":"e4a51f57-1dde-5345-bb2e-e10e1d52cfb6","has_transcript":true,"has_video":true,"summary":null,"summary_status":"stored","redacted":true},"transcript_payload":{"meeting_id":"4f304fff-fd40-5cfc-a366-0a134c445c2a","turns":[{"speaker":"Team member A","starts_at_seconds":516.4732,"timecode":"00:08:36","text":"I wanted to go through the issues you sent yesterday. If you share your screen, we can look at what is happening and I can take the details back to the team."},{"speaker":"Customer A","starts_at_seconds":599.613,"timecode":"00:09:59","text":"The first one is editing the description. I am changing this event-payment description to a short reference and clicking Save changes. Now look at the displayed description again."},{"speaker":"Team member A","starts_at_seconds":676.8065,"timecode":"00:11:16","text":"The field still shows the earlier wording. So the change is not appearing after you save, is that right?"},{"speaker":"Customer A","starts_at_seconds":691.549,"timecode":"00:11:31","text":"Yes, it is still the old description. That is why I sent it across."},{"speaker":"Team member A","starts_at_seconds":693.0225,"timecode":"00:11:33","text":"Please reopen Edit. I want to see whether the editing form has the new value while the other screen still has the old one."},{"speaker":"Customer A","starts_at_seconds":707.2065,"timecode":"00:11:47","text":"I will change it again to a different reference and save. It is saved now; let us check the other screen once more."},{"speaker":"Team member A","starts_at_seconds":728.6505,"timecode":"00:12:08","text":"I have captured screenshots of that behaviour. I will get it checked today. I do not have an explanation for it yet."},{"speaker":"Customer A","starts_at_seconds":745.8677,"timecode":"00:12:25","text":"Next is Recreate payment. Can we look at that here? When I go through this route, I cannot upload a document."},{"speaker":"Team member A","starts_at_seconds":759.5937,"timecode":"00:12:39","text":"A new attachment is not being accepted on this screen? First click Save changes at the bottom, before creating the bill, so we can check the alternative path."},{"speaker":"Customer A","starts_at_seconds":779.99365,"timecode":"00:12:59","text":"Saved. I have gone into Bill pay and then the invoice inbox. Now I am opening the Review option."},{"speaker":"Team member A","starts_at_seconds":802.0685,"timecode":"00:13:22","text":"Try attaching the invoice here. I am checking whether the upload itself fails or whether it is specifically the screen reached from Recreate payment."},{"speaker":"Customer A","starts_at_seconds":818.2117,"timecode":"00:13:38","text":"It uploads here. This route works, so it is not that I cannot attach a file anywhere."},{"speaker":"Team member A","starts_at_seconds":820.5005,"timecode":"00:13:40","text":"Please also check Manage documents for adding another attachment. While the team investigates the direct route, the workaround is to save the changes, return to the invoice inbox, open Review and upload the document there."},{"speaker":"Customer A","starts_at_seconds":893.08167,"timecode":"00:14:53","text":"Okay, we have an alternative for now. It is still extra steps compared with doing it directly when recreating the payment."},{"speaker":"Team member A","starts_at_seconds":894.9881,"timecode":"00:14:54","text":"Yes. I will still raise the original behaviour with the team. The workaround does not mean the direct upload issue has been resolved."},{"speaker":"Customer A","starts_at_seconds":901.9721,"timecode":"00:15:01","text":"The next issue is in reimbursements. I cannot select the first group of transactions on this screen."},{"speaker":"Team member A","starts_at_seconds":910.64966,"timecode":"00:15:10","text":"Those payments are already in Processing, which is why selection is disabled. Is this only for one user, or are others seeing the same thing?"},{"speaker":"Customer A","starts_at_seconds":931.8617,"timecode":"00:15:31","text":"It happened for another user too, though that instance was resolved later. This set is still in the same state."},{"speaker":"Team member A","starts_at_seconds":937.2701,"timecode":"00:15:37","text":"The payments appear to have been released but are stuck showing Processing. I have asked the team to look at these. I expect an update or resolution in an hour or two, and I will inform you when they confirm."},{"speaker":"Customer A","starts_at_seconds":983.60645,"timecode":"00:16:23","text":"There is one more problem. It was not in the original list, but I can show it now while we are here."},{"speaker":"Customer A","starts_at_seconds":987.5264,"timecode":"00:16:27","text":"When I use Mark as paid, the first payment shows INR 18,200. I enter the amount I need and save that payment. Then I open the next payment and choose Mark as paid again."},{"speaker":"Customer A","starts_at_seconds":1053.8384,"timecode":"00:17:33","text":"The amount from the previous item appears in the next one. Each time I have to cancel, leave it and open Mark as paid again before it shows the right information."},{"speaker":"Team member A","starts_at_seconds":1070.6229,"timecode":"00:17:50","text":"Let me confirm: it is retaining the previous amount rather than fetching the next payment's value. It should refresh when the next item opens, but that is not what we are seeing."},{"speaker":"Customer A","starts_at_seconds":1075.1364,"timecode":"00:17:55","text":"Yes, the old value carries forward. So I end up doing the same action twice for each item."},{"speaker":"Team member A","starts_at_seconds":1087.959,"timecode":"00:18:07","text":"I understand the sequence now. I will report that separately as well, with the steps you showed, and ask the team to investigate the refresh behaviour."},{"speaker":"Customer A","starts_at_seconds":1096.6953,"timecode":"00:18:16","text":"Those are the current issues. The attachment workaround helps, but we still need the other items checked."},{"speaker":"Team member A","starts_at_seconds":1099.657,"timecode":"00:18:19","text":"I will send the details to the team, get their confirmation and come back to you. Thank you for showing the actual steps rather than only the final screen."}],"unavailable_reason":null}}]},"analyses":{"call:2ec4404c-beee-5377-a63c-aab701da08ed":{"ref":"C01","text_hash":"23b6420124e76","analysed_revision":1,"route_ids":["coaching"],"route_reasons":{"coaching":"Outcome is a clear no with no follow-up; the useful output is how the opening went."},"headline":"Cold call to a contact who did not know why he was being called. He asked three times, challenged where his details came from, and ended with a clear no.","type":"Cold outreach, rejected","label_check":{"stored":"uninterested","verdict":"agrees","note":"The prospect says he is not interested and that the number is for his own work."},"signal":"none","out":{"coaching":{"summary":"Opening did not give a reason for the call until the prospect had asked repeatedly.","points":[{"k":"change","t":"The prospect had to ask 'why are you calling' more than once before getting a reason. Put the reason for the call in the first sentence after the name.","ev":["Why are you calling?","no, I asked why you have called me"]},{"k":"change","t":"He challenged where his details came from. Have one short, honest answer ready (the rep said a professional networking outreach programme).","ev":["Then where did you find my details?"]},{"k":"keep","t":"The rep acknowledged the interruption and left politely once the answer was no.","ev":["All right, thank you for hearing me out."]}]}},"next":[],"not_established":["Whether he asked to be removed from outreach. He said he was not interested but did not request removal.","Whether the stated reason ('very automated') is accurate; it is the prospect's own claim."],"flags":[],"review":null,"live":true},"call:4b870624-8aad-5315-a60e-0db95981cf99":{"ref":"C02","text_hash":"f3b80bdf1192f","analysed_revision":1,"route_ids":["log"],"route_reasons":{"log":"Switchboard only. Counted as activity, not as a substantive conversation."},"headline":"The call reached a switchboard. The caller asked for a named person who was not in, and was put through to her voicemail. No sales conversation took place.","type":"Gatekeeper / voicemail transfer","label_check":{"stored":"ooo (is_conversation=true)","verdict":"partly","note":"'ooo' fits (the contact is out of the office), but the only person spoken to is the receptionist, so is_conversation=true overstates it."},"signal":"none","out":{"log":{"summary":"Reached the company switchboard; contact out of office; transferred to voicemail.","points":[{"k":"fact","t":"The receptionist says the contact is not in today and offers voicemail.","ev":["It looks as though she isn't in the office today"]}]}},"next":[],"not_established":["Whether a voicemail was left; the text ends at the transfer.","Any callback time. None was stated."],"flags":["label-conflict"],"review":"Stored is_conversation=true, but only a receptionist was spoken to. Confirm it should not count as a conversation.","live":false},"call:20d509ba-d589-5334-9aef-ea4ce6105b1a":{"ref":"C03","text_hash":"17c70742ade4ac","analysed_revision":1,"route_ids":["deal"],"route_reasons":{"deal":"A follow-up commitment exists (email, then call Monday or Tuesday)."},"headline":"Follow-up on earlier talks about developer/API access. Audio was poor, interest is lukewarm and price was the earlier concern. Both sides agreed to continue by email and a call early next week.","type":"Follow-up call, existing prospect","label_check":{"stored":"follow_up","verdict":"agrees","note":"A follow-up is agreed, but the prospect's own wording is cautious."},"signal":"weak","out":{"deal":{"summary":"Weak-to-moderate signal. A follow-up email and call were agreed, but the prospect called the need 'not essential'.","points":[{"k":"fact","t":"Prospect: the developer functionality is not essential enough to spend much on; the last conversation leaned towards leaving things as they were.","ev":["it isn't essential enough for us to spend much on it","more about leaving things as they were"]},{"k":"fact","t":"Price was the earlier concern. The rep had invited the prospect to name a budget; that was to be discussed internally. No outcome is stated.","ev":["price was a concern"]},{"k":"fact","t":"The prospect asked for email because of a poor connection (roaming).","ev":["Could we do this by email?"]}]}},"next":[{"a":"Send the follow-up email with the subject 'Developer access and event notifications — follow-up'.","owner":"Kiran (the caller)","when":"Not dated; the call is meant to follow","ev":["Developer access and event notifications"]},{"a":"Call again Monday or Tuesday (24 or 25 Aug), after the email.","owner":"Kiran","when":"Monday/Tuesday (calendar-derived)","ev":["Monday or Tuesday"]}],"not_established":["Budget. The prospect did not give one.","Whether the team is still evaluating; 'I would need to check with the team'."],"flags":[],"review":null,"live":true},"call:bcdcbf56-d338-5c78-9a97-42c2fc1c9931":{"ref":"C04","text_hash":"12654ee53a96a3","analysed_revision":1,"route_ids":["deal"],"route_reasons":{"deal":"Open follow-up on an earlier proposal. Waiting on the prospect."},"headline":"Voicemail left for a prospect who had earlier received the information at a wrong email address and then at a corrected one. The rep asks for a callback.","type":"Voicemail follow-up","label_check":{"stored":"voicemail","verdict":"agrees","note":"The prospect did not pick up; the transcript is a screening prompt plus the rep's message."},"signal":"unknown","out":{"deal":{"summary":"No conversation took place. The record matters because an earlier send went to the wrong address.","points":[{"k":"fact","t":"Information first went to a wrong email address and was later re-sent to the corrected one.","ev":["our information first went to the wrong email address"]},{"k":"fact","t":"The rep asks for a callback to say where things stand or what questions remain.","ev":["Please call me back to let me know where things stand."]}]}},"next":[{"a":"Wait for the callback. If none comes, choose another channel, since the email path has already failed once.","owner":"Arun (the caller)","when":"Not stated","ev":["Please call me back to let me know where things stand."]}],"not_established":["Whether the corrected email was seen.","The prospect's interest: nothing was said by the prospect."],"flags":[],"review":null,"live":false},"call:75a6b94f-7717-5cfb-9e41-0acc94415e17":{"ref":"C05","text_hash":"f22d675bed2fa","analysed_revision":1,"route_ids":["deal"],"route_reasons":{"deal":"One concrete action (send a presentation) and a competitor mention worth recording."},"headline":"Cold call to a multi-store business that already has vendor management, payments and store-level payments. The prospect only asked for a presentation for a possible future switch.","type":"Cold outreach, low intent","label_check":{"stored":"follow_up","verdict":"partly","note":"The only action is to send a presentation. The prospect says existing providers cover the need, so this is a low-priority courtesy send, not an active follow-up."},"signal":"weak","out":{"deal":{"summary":"Weak signal. Existing tools cover the pitch; a presentation was requested for a possible future review.","points":[{"k":"fact","t":"Prospect already has vendor management, vendor payments and store-level payments.","ev":["We already have that.","We have that too."]},{"k":"fact","t":"Competitor named: StoreHarbor, plus other platforms not named.","ev":["One is StoreHarbor"]},{"k":"fact","t":"Condition for reconsidering: a decision to change current providers.","ev":["If we ever decide to change the providers we already have, we could consider it then."]}]}},"next":[{"a":"Email the presentation to the confirmed address (contact05@example.com). No call is scheduled.","owner":"Meera (the caller)","when":"Not stated","ev":["may I confirm contact05@example.com"]}],"not_established":["Contract end dates for current providers.","Whether any gap exists in what they use today."],"flags":[],"review":null,"live":true},"call:12216d5c-e254-52c6-b344-47de4c6e1ae5":{"ref":"C06","text_hash":"143f33aa29b83c","analysed_revision":1,"route_ids":["coaching"],"route_reasons":{"coaching":"Useful objection-handling material; no deal to track."},"headline":"Cold call to a business with more than 120 stores. The prospect said the essential processes are already automated and connected, and no follow-up was set.","type":"Cold outreach, rejected","label_check":{"stored":"uninterested","verdict":"agrees","note":"'If a particular need comes up later, we will reach out' is a decline with no date."},"signal":"none","out":{"coaching":{"summary":"Good permission-based opener and a smart closing question; the rep kept comparing features after the prospect had closed the topic.","points":[{"k":"keep","t":"Opened by saying it was a cold call and asking for forty seconds, with an easy exit.","ev":["this is a cold call"]},{"k":"keep","t":"Asked whether managers use company cards or cash advances, a discovery question that also stops repeat calls from colleagues.","ev":["Do managers use company cards, or are local expenses handled through cash advances?"]},{"k":"change","t":"After 'we already have many of those things in place' and 'we will reach out', the rep added a further visibility claim. Stop at the second signal.","ev":["That is why I said the arrangements are already in place."]}]}},"next":[],"not_established":["Whether 'a mixed model' of cards and cash is a real gap."],"flags":["speaker-name-mismatch"],"review":"The caller introduces himself as 'Ravi' but the call record lists Meera as the rep. Attribution of this call to Meera is unconfirmed.","live":true},"call:428817fa-7e9e-5418-a7d4-bb396d28dfbf":{"ref":"C07","text_hash":"13ece867b5c373","analysed_revision":1,"route_ids":["partner"],"route_reasons":{"partner":"The contact would refer their clients; the offer is a partnership, not a purchase."},"headline":"Call to an advisory firm that incorporates companies abroad and refers clients to account providers. The firm asked for a proposal by chat and agreed to a call on Monday. The line dropped during the call.","type":"Partner / referral prospect","label_check":{"stored":"follow_up","verdict":"agrees","note":"A proposal and a Monday call are agreed. The contact is a potential referral partner, not a direct buyer."},"signal":"moderate","out":{"partner":{"summary":"Partner prospect. They already refer clients to account providers and asked for the proposal in writing.","points":[{"k":"fact","t":"Firm already refers clients to providers for this step of the process.","ev":["Yes, that is something we normally do."]},{"k":"fact","t":"Rep positioned SpendNest virtual accounts as available to firms' clients after incorporation, naming other providers as comparisons.","ev":["a virtual business account after incorporation"]},{"k":"fact","t":"The contact asked for the proposal on the chat app, and agreed to a call on Monday after receiving it.","ev":["send whatever proposal you have","could I call on Monday"]}]}},"next":[{"a":"Send the partner proposal to the same number on the chat app.","owner":"Dev (the caller)","when":"Before Monday","ev":["send whatever proposal you have"]},{"a":"Call on Monday (24 Aug) once the proposal is received.","owner":"Dev","when":"Monday (calendar-derived)","ev":["Yes, that's fine."]}],"not_established":["Commission or revenue terms; none were discussed.","How many clients the firm would refer.","What was said after the line dropped ('Hello?')."],"flags":[],"review":null,"live":true},"call:129497b2-8e1d-5e01-919c-e8a852b5ff68":{"ref":"C08","text_hash":"1acb74936b621","analysed_revision":1,"route_ids":["deal"],"route_reasons":{"deal":"A colleague at the prospect is already discussing a solution."},"headline":"Cold call that produced the strongest lead in the call set. The contact said his firm may already have been looking at a solution and asked for a proposal to be sent to a named colleague in people operations.","type":"Cold outreach, internal referral","label_check":{"stored":"referred","verdict":"agrees","note":"He refers the rep to a colleague and says internal discussions exist; the rep may mention his name."},"signal":"moderate","out":{"deal":{"summary":"Moderate signal. Internal discussion exists, an owner on the prospect side is named, and the rep is allowed to use the contact's name.","points":[{"k":"fact","t":"The contact thinks the firm may have been looking at a solution, without details.","ev":["I think we may have been looking at a solution","There have been some discussions."]},{"k":"fact","t":"He permits the rep to say they spoke.","ev":["say you spoke with me"]},{"k":"fact","t":"Rep positioned SpendNest alongside the existing management system, covering payment execution and records.","ev":["We position it alongside one."]}]}},"next":[{"a":"Send the proposal to contact08@example.com (read back and confirmed), mentioning the call with Raghav.","owner":"Meera (the caller)","when":"Not stated","ev":["contact08@example.com"]}],"not_established":["The colleague's authority, budget or timeline.","Which solution they were considering."],"flags":[],"review":null,"live":true},"call:4a1de681-f884-55e8-b1ad-de22d17cd959":{"ref":"C09","text_hash":"177ba9080189dc","analysed_revision":1,"route_ids":["deal"],"route_reasons":{"deal":"A named business head can be approached through a professional network, but without naming this contact."},"headline":"Cold call to a business with about 130 locations that uses internally built software. The contact pointed the rep to the business head but asked that his name not be used.","type":"Cold outreach, referral with a condition","label_check":{"stored":"referred","verdict":"partly","note":"A referral exists, but with an explicit restriction: 'No, please don't use my name.' A route labelled 'referred' hides that constraint."},"signal":"weak","out":{"deal":{"summary":"Weak signal with a hard constraint on how the referral may be used.","points":[{"k":"fact","t":"Prospect has internal software and is not looking outside.","ev":["We have developed our own software internally"]},{"k":"fact","t":"He does not know if the internal system only records expenses or also makes payments.","ev":["I don't know the detail."]},{"k":"fact","t":"Constraint: the rep must not mention his name when contacting the business head.","ev":["No, please don't use my name."]}]}},"next":[{"a":"Optionally approach the business head (Mr Rishabh) through the professional network. Do not name the original contact.","owner":"Meera (the caller)","when":"Not stated","ev":["No, please don't use my name."]}],"not_established":["Whether the head is open to a conversation.","Whether the internal system makes payments."],"flags":["name-restriction"],"review":"Do-not-name constraint must be visible to whoever contacts the business head.","live":true},"call:b747f592-810e-583c-9b81-8db5ab035806":{"ref":"C10","text_hash":"11dac0dc0050c1","analysed_revision":1,"route_ids":["deal"],"route_reasons":{"deal":"One written brief is allowed. A scheduled follow-up call is not."},"headline":"Cold call where the contact had left the company named by the rep and now works at a manufacturer. He asked for a brief on a messaging app and refused a follow-up call.","type":"Cold outreach, stale contact","label_check":{"stored":"follow_up","verdict":"disagrees","note":"The prospect declined the follow-up call: 'No. I said I will contact you if there is anything to discuss.' Only the written brief is supported."},"signal":"weak","out":{"deal":{"summary":"Weak signal. Contact is no longer at the target company and has declined a follow-up call.","points":[{"k":"fact","t":"He no longer works at the company the rep was calling about and has moved to a manufacturing business.","ev":["I don't work there anymore."]},{"k":"fact","t":"He asked for a brief on the messaging app.","ev":["send me a brief on the messaging app"]},{"k":"fact","t":"He refused a follow-up call on Monday or Tuesday.","ev":["No. I said I will contact you if there is anything to discuss."]}]}},"next":[{"a":"Send one brief on the messaging app. Do not schedule a follow-up call.","owner":"Meera (the caller)","when":"Not stated","ev":["send me a brief on the messaging app"]},{"a":"Update the contact record: no longer at Meadowbrick; now at an unnamed manufacturer.","owner":"Not stated","when":"—","ev":["I don't work there anymore."]}],"not_established":["The new employer's name.","Whether he will read the brief."],"flags":["label-conflict","stale-contact"],"review":"Stored follow_up conflicts with an explicit refusal of a follow-up call.","live":true},"meeting:cb5cecac-e68d-52b7-b10b-b0c748efc467":{"ref":"M01","text_hash":"14be95318b2c31","analysed_revision":1,"route_ids":["partner"],"route_reasons":{"partner":"The counterpart refers clients; the discussion is commission, tracking and onboarding rules."},"headline":"Onboarding call with a referral partner (an advisory firm). The partner needs written terms and a scalable way to send leads. SpendNest will send documents and a unique referral link.","type":"Partner onboarding","label_check":null,"signal":"moderate","out":{"partner":{"summary":"Partner agreed to start onboarding. Open items are written terms, the memorandum and the referral link.","points":[{"k":"fact","t":"Scope boundary: registered businesses only, with a US entity for virtual accounts; no personal accounts.","ev":[2,4]},{"k":"fact","t":"Referral commission as stated by SpendNest: USD 260 when a referred company is approved, plus card-spend bonuses and a volume bonus.","ev":[9]},{"k":"fact","t":"Referred businesses need evidence of US operations, which a new company may lack.","ev":[13]},{"k":"fact","t":"Partner will not write every introduction by hand; the agreed route is a unique link plus a shared tracking sheet.","ev":[16,20,21]},{"k":"fact","t":"Partner: 'let us get the partner onboarding started'.","ev":[12]},{"k":"fact","t":"Limits to disclose: funds are received by bank transfer, not card payments; the account must be funded first.","ev":[23]}]}},"next":[{"a":"Send the documents and information discussed, including the memorandum to sign.","owner":"Team member A (stated)","when":"Not dated","ev":[13,25]},{"a":"Provide the unique referral link and the shared tracking sheet.","owner":"Team member A","when":"Not dated","ev":[17,21]},{"a":"Connect the partner with marketing about a podcast and a partner-page listing.","owner":"Team member A","when":"Not dated","ev":[27]}],"not_established":["That the memorandum is signed.","Expected referral volume.","Terms are SpendNest's statements; no document was seen."],"flags":[],"review":null},"meeting:1a21c409-c050-5787-90af-2667e057e1b6":{"ref":"M02","text_hash":"1f2238a28de50a","analysed_revision":1,"route_ids":["internal"],"route_reasons":{"internal":"The counterpart sells to SpendNest. It must not appear in the sales pipeline."},"headline":"Evaluation call where SpendNest is the buyer. LedgerBridge is a supplier of e-invoicing. The discussion covers pricing models, a volume template, and a disagreement about sending a written proposal.","type":"Vendor evaluation (SpendNest buying)","label_check":null,"signal":"n/a","out":{"internal":{"summary":"Vendor note for the product and strategy team. Not a customer or prospect conversation.","points":[{"k":"fact","t":"SpendNest is evaluating compliant e-invoicing coverage for its receivables module.","ev":[1,8]},{"k":"fact","t":"Pricing structures offered: country licences with usage, or licences per end customer with volume tiers; setup from EUR 2,600 (basic) or EUR 6,500 (supported).","ev":[29,31]},{"k":"fact","t":"SpendNest's target is the fourth quarter (Singapore and Australia, then India), but its own team says the date can move.","ev":[13,15]},{"k":"fact","t":"Issued-invoice volumes will be estimates because the receivables product is still being built.","ev":[18]},{"k":"fact","t":"Disagreement: the supplier prefers a walkthrough; SpendNest needs written pricing for internal approval.","ev":[32,33,34]}]}},"next":[{"a":"Send the volume template.","owner":"LedgerBridge (Supplier A, stated)","when":"'shortly'","ev":[17,36]},{"a":"Complete the template and brief management on stakeholders for the commercial call.","owner":"SpendNest (team not stated)","when":"Not dated","ev":[32,35]},{"a":"Try the sandbox with a test key.","owner":"SpendNest (suggested by supplier)","when":"Not dated","ev":[27]}],"not_established":["That management has approved the project or budget.","Which customers require e-invoicing.","Final choice of supplier."],"flags":[],"review":null},"meeting:398672e7-62dd-5afd-846d-0237d49792fb":{"ref":"M03","text_hash":"10b7edcfbf581f","analysed_revision":1,"route_ids":["deal","coaching"],"route_reasons":{"deal":"Active evaluation with a named next step and a decision-maker still to approve.","coaching":"Two avoidable surprises: prepaid vs credit, and the price build-up."},"headline":"Late-stage evaluation call. The customer expected a corporate credit card but the domestic cards are prepaid. The price shifted from INR 26,000 to 39,000 during the call, and the CFO has not yet seen the proposal.","type":"Prospect evaluation","label_check":null,"signal":"moderate","out":{"deal":{"summary":"Moderate signal. The customer wants cards to fix reimbursement friction and would start with four or five employees.","points":[{"k":"fact","t":"Customer thought the product was a corporate credit card and learned it is prepaid with no credit facility.","ev":[6,7]},{"k":"fact","t":"Quoted: INR 26,000 plus tax yearly subscription and INR 13,000 one-time accounting-integration setup (INR 39,000 plus tax in total). This is a quoted price, not pipeline value.","ev":[22,23,24]},{"k":"fact","t":"Would start with four or five employees to see feedback and workflow first.","ev":[26]},{"k":"fact","t":"The CFO approves larger payments and has not yet been briefed.","ev":[28]},{"k":"fact","t":"Automatic sync to accounting after approval is not built; the current flow is manual selection.","ev":[16]},{"k":"fact","t":"Existing overseas provider stays; international cards were kept out of scope.","ev":[19,20]}]},"coaching":{"summary":"Both friction points could have been prevented by stating them earlier.","points":[{"k":"change","t":"State up front that domestic cards are prepaid. The customer discovered it mid-demo.","ev":[6]},{"k":"change","t":"Quote one price structure (subscription and setup shown separately) the first time.","ev":[22,23,24]},{"k":"keep","t":"Said plainly what is not built (automatic sync) instead of implying it.","ev":[16]},{"k":"keep","t":"Separated the international credit route from the domestic option.","ev":[20]}]}},"next":[{"a":"Send the cards proposal and information about the other modules.","owner":"Team member A (stated)","when":"Not dated","ev":[35]},{"a":"Customer to brief the CFO and say whether another call is needed. Do not book one unasked.","owner":"Customer B (stated)","when":"Customer's decision","ev":[36]}],"not_established":["Deal value or probability.","The CFO's position.","Monthly spend (INR 10–13 lakh was an unchecked estimate)."],"flags":[],"review":null},"meeting:b0f79b3d-37ba-52f9-b2bc-58b159dd6d91":{"ref":"M04","text_hash":"16111581ad5f52","analysed_revision":1,"route_ids":["customer","deal"],"route_reasons":{"customer":"Existing customer with an announced programme change and open questions.","deal":"A possible add-on: connecting bank-issued credit cards alongside prepaid."},"headline":"Existing customer is being moved to a different card programme and says moving from prepaid to credit is its main issue. Several answers are unconfirmed: bank-card eligibility, accounting sync, and a department-move session.","type":"Existing customer, migration","label_check":null,"signal":"moderate","out":{"customer":{"summary":"Retention-risk signal. The customer is not deciding the migration on this call and has an alternative via its bank.","points":[{"k":"fact","t":"The old card programme is planned to close 'in the coming weeks'; physical and virtual cards stop, with new identity checks.","ev":[4,5,6]},{"k":"fact","t":"Customer: moving from prepaid to credit is the main issue. The replacement is still prepaid.","ev":[10,11]},{"k":"fact","t":"Bank-card feed shows transactions after settlement, not the available credit limit.","ev":[19,25]},{"k":"fact","t":"Customer asks what SpendNest adds beyond the bank portal; the answer given was receipts, reasons, exception review and reconciliation.","ev":[26,27]},{"k":"fact","t":"Users cannot be moved between departments from the assistant's view. A guided session was offered.","ev":[30,31]},{"k":"fact","t":"Customer will consult internally and is not deciding the migration on this call.","ev":[29]}]},"deal":{"summary":"Possible expansion if the bank-card feed is eligible. Not yet established as feasible.","points":[{"k":"fact","t":"Customer is considering bank credit cards for about 26 people and SpendNest prepaid for the rest. Existing credit line about INR 1.3 crore.","ev":[13,22]},{"k":"fact","t":"Existing issued cards may not qualify for the feed; SpendNest cannot confirm.","ev":[23]}]}},"next":[{"a":"Confirm whether the customer's already-issued bank cards can join the transaction feed.","owner":"Team member A (stated)","when":"Not dated","ev":[23,28]},{"a":"Confirm accounting-sync feasibility for bank-card transactions.","owner":"Team member A","when":"Not dated","ev":[21,28]},{"a":"Arrange a guided session to verify which departments and users should move.","owner":"Team member A","when":"Not dated","ev":[31]},{"a":"Discuss options internally, bring in the credit team, and come back on departments.","owner":"Customer A (stated)","when":"Not dated","ev":[17,29,32]}],"not_established":["That the customer will leave.","Whether the programme will really close on the stated schedule.","Whether this meeting is the same conversation as M13 (unrecorded migration meeting, same account label and overlapping time)."],"flags":["possible-duplicate"],"review":"M13 has the same account name and an overlapping slot but no capture. Treated as a related record, not merged."},"meeting:657b9e9d-9472-5b01-a127-a648ad7e8cf7":{"ref":"M06","text_hash":"62da98187c852","analysed_revision":1,"route_ids":["deal","coaching"],"route_reasons":{"deal":"Early interest; contact is not clearly the decision-maker.","coaching":"A leading question moved a number; a security question needs a specific follow-up."},"headline":"Discovery call with a branch finance contact. Most finance work sits with a central team of about 65. The contact's invoice-volume figure was reshaped by the rep's prompt, and a security question was answered generally.","type":"Discovery, early stage","label_check":null,"signal":"weak","out":{"deal":{"summary":"Weak signal. The contact asked for material and to stay in touch, and said the central team handles most work.","points":[{"k":"fact","t":"Local scope: about eight clients; supplier payments and most operations sit centrally.","ev":[2,7,9]},{"k":"fact","t":"Manual work today: contract terms and bank receipts tracked by hand; collections chased through delivery managers.","ev":[9,10,25]},{"k":"fact","t":"Ends with 'please send the information and we can stay in touch'.","ev":[33]}]},"coaching":{"summary":"Do not offer numbers for the customer to accept.","points":[{"k":"change","t":"The customer first said 260–390 invoices a month; after the rep's 'so perhaps nearer 390–520' she said 'approximately' and called all of it rough. Use her first figure, as a rough number.","ev":[12,15,16]},{"k":"change","t":"The security question got a general answer. Send specific documents with the follow-up.","ev":[31,32]},{"k":"keep","t":"Positioned automation as exceptions that go to a person, which matched the customer's own view.","ev":[21,23]}]}},"next":[{"a":"Send material on collections automation, the expense side and security.","owner":"Team member A (stated)","when":"Not dated","ev":[29,32,33]}],"not_established":["Decision-maker or budget.","Company-wide invoice volume. The contact handles about eight clients and gave a rough figure."],"flags":[],"review":null},"meeting:4f304fff-fd40-5cfc-a366-0a134c445c2a":{"ref":"M07","text_hash":"1f1a3be0c7a950","analysed_revision":2,"route_ids":["customer"],"route_reasons":{"customer":"Existing customer reporting problems; the output is a list of issues and commitments."},"headline":"Screen-share session with an existing customer on four product issues. One has a workaround; three are open. The rep gave time-bound promises for an update.","type":"Customer issue triage","label_check":null,"signal":"n/a","out":{"customer":{"summary":"Four issues, one workaround, three with promised follow-ups. Nothing here is a sales conversation.","points":[{"k":"fact","t":"Description edits do not appear after saving. The rep captured screenshots and had no explanation yet.","ev":[2,3,7]},{"k":"fact","t":"Recreate payment: a document cannot be uploaded there. Workaround: save, go back to the invoice inbox, open Review and upload there.","ev":[8,12,13]},{"k":"fact","t":"Reimbursement payments appear released but stay in Processing, so selection is disabled.","ev":[17,19]},{"k":"fact","t":"Mark as paid carries the previous payment's amount into the next one, so each item is done twice.","ev":[22,24]}]}},"next":[{"a":"Get the description-saving behaviour checked.","owner":"Team member A (stated)","when":"'today'","ev":[7]},{"a":"Send an update on the stuck Processing payments.","owner":"Team member A","when":"'an hour or two'","ev":[19]},{"a":"Report the upload and Mark as paid issues with steps, then confirm and come back to the customer.","owner":"Team member A","when":"Not dated","ev":[15,25,27]}],"not_established":["Whether any issue was fixed or the promised updates were given.","Root causes."],"flags":[],"review":null},"meeting:4b5b9192-f3fc-505a-8e77-4d2ffaa54594":{"ref":"M09","text_hash":"1139ed2cd7e58f","analysed_revision":1,"route_ids":["customer"],"route_reasons":{"customer":"Existing customer blocked from logging in, with a dated promise and a permissions design question."},"headline":"Accoun   }
  function byHour(rows) {
    var h = []; for (var i = 0; i < 24; i++) h.push({ hour: i, calls: 0, meetings: 0 });

  // ---------- export ----------
  function csvCell(v) { v = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function csv(rows, cols) { return [cols.join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return csvCell(r[c]); }).join(','); })).join('\n') + '\n'; }

  function evText(rec, ev) {
    if (rec.source_type === 'meeting') return 'turn ' + ev;

  }
  function evList(rec, evs) { return (evs || []).map(function (e) { return evText(rec, e); }).join('; '); }
  function turnText(rec, n) {

    return tp.turns[n - 1].text;

  function recordHeader(d, route, siblings) {

    L.push('');
    L.push('| Field | Value |'); L.push('|---|---|');
    L.push('| source_type / source_id | ' + r.source_type + ' / ' + r.source_id + ' |');
    L.push('| Applied source revision | ' + r.applied_revision + ' (batch ' + r.batch_id + ') |');
    L.push('| Time (Asia/Kolkata) | ' + d.when.date + ' ' + d.when.hm + ' |');
    L.push('| Person | ' + (d.person || 'unknown') + (r.source_type === 'meeting' ? ' (calendar organiser, not necessarily the salesperson)' : ' (call rep)') + ' |');
    L.push('| Route origin | ' + (d.override ? 'MANUAL correction (' + d.override.set_at + ')' + (d.override.note ? ' — ' + d.override.note : '') : 'Automated suggestion') + ' |');
    L.push('| All routes for this record | ' + d.effective.map(function (x) { return ROUTES[x].label; }).join(', ') + ' |');

  function buildExport(state, analyses, brief, opts) {

    var shared = { log: 'activity-log/dial-log_' + REPORT_DATE + '.csv', gap: 'capture-gaps/capture-gaps_' + REPORT_DATE + '.csv' };
    var logRows = [], gapRows = [];

    rows.slice().sort(function (a, b) { return a.ref.localeCompare(b.ref); }).forEach(function (d) {
      var r = d.rec, p = r.payload, id8 = r.source_id.slice(0, 8);

        var rel = shareable ? shared[rt] : ROUTES[rt].folder + '/' + r.record_ref + '_' + id8 + '_' + slug(r.source_type === 'meeting' ? p.title : 'call-' + (p.rep_name || '')) + '.md';

  function briefMarkdown(state, analyses, brief, rows, m) {

    brief.coaching.forEach(function (x) { var d = byRef[x.ref]; if (d && d.usable) L.push('- **' + x.who + '.** ' + x.t); });

  // ---------- replay self-test (runs on a throwaway state) ----------

    var M07 = null;

<script>
(function () {

  var KEY = 'rii.state.v1';
  var VIEWS = [['today', 'Today'], ['brief', 'Brief 21 Aug'], ['inbox', 'Inbox'], ['routes', 'Routes'], ['data', 'Import & export'], ['method', 'Method']];

  var state = load();
  var firstRun = false;
  if (!state) { state = R.newState(); R.importBatch(state, R.clone(INITIAL), 'initial-001 (demo load)'); R.importBatch(state, R.clone(UPDATE), 'update-002 (demo load)'); firstRun = true; save(); }

  var ui = { view: 'today', person: '', type: '', route: '', review: '', q: '', open: null, tab: 'analysis', hl: null, selFile: null, selflog: null, toast: '', edit: null };

  function toast(msg) { ui.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(function () { ui.toast = ''; render(); }, 3200); }
  function n1(x) { return x === null || x === undefined ? 'n/a' : x + '%'; }

  // ---------- chips ----------

  function routeChips(d) { return '<span class="chips">' + d.effective.map(function (r) { return rChip(r); }).join('') + (d.override ? '<span class="chip manual">Manual</span>' : '') + '</span>'; }
  var STATE_LABEL = { 'needs-decision': ['Needs a decision', 'warn'], 'stale': ['Analysis stale', 'bad'], 'awaiting-text': ['Awaiting transcript', 'warn'], 'analysed': ['Analysed', 'good'], 'reviewed': ['Reviewed', 'good'], 'log-only': ['Log only', 'plain'], 'capture-gap': ['Capture gap', 'plain'] };
  function stateChip(d) { var s = STATE_LABEL[d.reviewState] || [d.reviewState, 'plain']; return '<span class="chip ' + s[1] + '">' + s[0] + '</span>'; }

  function filtered(all) {

    if (ui.review) out = out.filter(function (d) { return d.reviewState === ui.review; });

      var q = ui.q.toLowerCase();

  }
  function filterBar(all, opts) {
    opts = opts || {};

      s += '<label class="grow">Search ref, title or transcript<input type="search" id="f-q" data-f="q" value="' + esc(ui.q) + '" placeholder="e.g. prepaid, C08, Cedarwave"></label>';
    }

  // ---------- Today ----------
  function kpi(label, num, sub, def) {
    return '<div class="card kpi"><span class="lbl">' + label + '</span><span class="num">' + num + '</span><span class="sub">' + sub + '</span><details><summary>Definition</summary><p>' + def + '</p></details></div>';
  }
  function viewToday() {
    var all = rows(), rs = filtered(all), m = R.metrics(rs);

    if (firstRun) s += '<div class="banner"><span>Loaded the demo data: initial delivery (revision 1) then the update (revision 2). Use <b>Import &amp; export</b> to reset and replay each step.</span><button class="btn sm" data-act="dismiss-first">Dismiss</button></div>';
    if (!all.length) return s + emptyState();

    var noText = { calls: rs.filter(function (d) { return d.rec.source_type === 'call' && !d.usable; }).length, silent: rs.filter(function (d) { return d.text.id === 'silent'; }).length, nocap: rs.filter(function (d) { return d.text.id === 'not-captured'; }).length, pending: rs.filter(function (d) { return d.text.id === 'pending'; }).length };
    s += '<div class="kpis">';
    s += kpi('Selected records', '<span>' + m.records + '</span>', m.calls + ' calls · ' + m.meetings + ' meetings', 'Distinct (source_type, source_id) pairs after applying the latest revision of each. Importing the same file again cannot raise this number. Counted for the current filter: ' + (ui.person || ui.type ? 'filtered' : 'all selected records') + '. Calls are dated by started_at, meetings by starts_at, in Asia/Kolkata.');
    s += kpi('Usable text coverage', m.coverage === null ? 'n/a' : m.coverage + '<small>%</small>', m.textAll + ' of ' + m.records + ' records · calls ' + m.textCalls + '/' + m.calls + ' · meetings ' + m.textMeetings + '/' + m.meetings, 'Records with a non-blank call transcript or at least one non-blank meeting turn, divided by selected records in the same filter. Without text: ' + noText.calls + ' calls (no transcript supplied), ' + noText.silent + ' meetings recorded with nobody speaking, ' + noText.nocap + ' meetings not captured, ' + noText.pending + ' awaiting a transcript. A missing text does not show that nothing happened.');
    s += kpi('Connected calls (source-reported)', m.connKnown ? m.connRate + '<small>%</small>' : 'n/a', m.connTrue + ' of ' + m.connKnown + ' calls with a known is_connected' + (m.connUnknown ? ' · ' + m.connUnknown + ' unknown' : ''), 'Calls with is_connected=true divided by calls where is_connected is not null. This is the earlier system\'s label, not checked against text. Separate, transcript-based reading: of ' + m.liveDen + ' calls with text, ' + m.liveNum + ' reached a live person (the other calls reached a voicemail or a switchboard). The two measures use different denominators and are not combined. Meetings are excluded.');
    s += kpi('Routing', m.assignments + '<small> routes</small>', 'across ' + m.records + ' records · ' + m.multiRoute + ' with more than one route' + (m.manual ? ' · ' + m.manual + ' manual' : ''), 'A record can have several routes, so assignments can exceed records. Each is counted once per record and route. Manual corrections replace the suggested routes for that record.');
    s += kpi('Needs a person', '<span>' + m.attention + '</span>', 'records with an open decision, stale analysis or pending transcript', 'Records whose review state is "needs a decision", "analysis stale" or "awaiting transcript". Reasons include a stored label that disagrees with the text, a do-not-use-name request, or a possible duplicate meeting. Marking a record reviewed clears it until the source changes.');
    s += '</div>';

    // attention + hour chart
    var att = rs.filter(function (d) { return d.reviewState === 'needs-decision' || d.reviewState === 'stale' || d.reviewState === 'awaiting-text'; });
    s += '<div class="grid2"><section class="card"><div class="pad"><h2>Needs your attention (' + att.length + ')</h2></div>';
    s += att.length ? '<ul class="attn">' + att.map(function (d) { return '<li><button data-act="open" data-key="' + esc(d.key) + '"><span class="ref">' + esc(d.ref) + '</span><span>' + esc(titleOf(d)) + ' ' + stateChip(d) + '</span><span class="why">' + esc(d.reviewReason || d.text.label) + '</span></button></li>'; }).join('') + '</ul>' : '<p class="empty">Nothing waiting for a decision in this filter.</p>';
    s += '</section>' + hourChart(rs) + '</div>';

    // people + routes
    var ppl = R.people(rs, state);
    s += '<div class="grid2"><section class="card"><div class="pad"><h2>Activity by person</h2><p class="small muted" style="margin-top:4px">Calls are counted for the rep. Meetings are counted for the calendar organiser, who is not necessarily the salesperson or an attendee.</p></div><div class="tablewrap"><table><thead><tr><th>Person</th><th class="num">Calls as rep</th><th class="num">Meetings as organiser</th><th class="num">With text</th></tr></thead><tbody>';
    s += ppl.map(function (p) { return '<tr class="click" data-act="person" data-id="' + esc(p.id) + '"><td><button class="linkbtn" data-act="person" data-id="' + esc(p.id) + '">' + esc(p.name) + '</button><div class="faint small mono">' + esc(p.id) + '</div></td><td class="num">' + p.calls + '</td><td class="num">' + p.meetings + '</td><td class="num">' + p.text + '/' + p.total + '</td></tr>'; }).join('');
    s += '</tbody></table></div></section>';
    var max = Math.max.apply(null, R.ROUTE_ORDER.map(function (r) { return m.byRoute[r] || 0; }).concat([1]));
    s += '<section class="card"><div class="pad"><h2>Where records were routed</h2><p class="small muted" style="margin-top:4px">' + m.assignments + ' route assignments for ' + m.records + ' records. Click a route to list its records.</p></div><div class="bars">';
    s += R.ROUTE_ORDER.map(function (r) { var c = m.byRoute[r] || 0; return '<button class="bar" data-act="route-filter" data-id="' + r + '"><span class="lab">' + rChip(r) + '</span><span class="track"><span class="fill" style="display:block;width:' + (c / max * 100) + '%;background:var(--r-' + r + ')"></span></span><span class="mono">' + c + '</span></button>'; }).join('');
    s += '</div></section></div>';

  }

  function hourChart(rs) {
    var hrs = R.byHour(rs), W = 560, H = 190, L = 28, B = 22, T = 14, bw = (W - L - 6) / 24;
    var max = Math.max.apply(null, hrs.map(function (x) { return x.calls + x.meetings; }).concat([4]));
    max = Math.ceil(max / 4) * 4;
    var sy = function (v) { return T + (H - T - B) * (1 - v / max); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Selected records by hour of day, Asia/Kolkata" style="width:100%;height:auto;display:block">';
    for (var t = 0; t <= max; t += max / 4) { svg += '<line x1="' + L + '" x2="' + (W - 4) + '" y1="' + sy(t) + '" y2="' + sy(t) + '" stroke="var(--line2)"/><text x="' + (L - 5) + '" y="' + (sy(t) + 3) + '" text-anchor="end">' + t + '</text>'; }
    hrs.forEach(function (x, i) {
      var cx = L + i * bw, w = bw * 0.7, y1 = sy(x.meetings), y0 = sy(0);
      if (x.meetings) svg += '<rect x="' + (cx + bw * 0.15) + '" y="' + y1 + '" width="' + w + '" height="' + (y0 - y1) + '" fill="var(--c-meet)"><title>' + String(i).padStart(2, '0') + ':00 · ' + x.meetings + ' meetings</title></rect>';
      if (x.calls) { var yc = sy(x.meetings + x.calls); svg += '<rect x="' + (cx + bw * 0.15) + '" y="' + yc + '" width="' + w + '" height="' + (y1 - yc) + '" fill="var(--c-call)"><title>' + String(i).padStart(2, '0') + ':00 · ' + x.calls + ' calls</title></rect>'; }
      if (x.calls + x.meetings) svg += '<text x="' + (cx + bw * 0.5) + '" y="' + (sy(x.calls + x.meetings) - 3) + '" text-anchor="middle" style="fill:var(--ink)">' + (x.calls + x.meetings) + '</text>';
      if (i % 3 === 0) svg += '<text x="' + (cx + bw * 0.5) + '" y="' + (H - 6) + '" text-anchor="middle">' + String(i).padStart(2, '0') + '</text>';
    });
    svg += '</svg>';
    var peak = hrs.slice().sort(function (a, b) { return (b.calls + b.meetings) - (a.calls + a.meetings); })[0];
    var note = peak && peak.calls + peak.meetings ? 'Busiest hour: ' + String(peak.hour).padStart(2, '0') + ':00 IST with ' + (peak.calls + peak.meetings) + ' records (' + peak.calls + ' calls, ' + peak.meetings + ' meetings).' : '';
    return '<section class="card"><div class="pad"><h2>Selected activity by hour, 21 Aug 2026</h2><p class="small muted" style="margin-top:4px">Records per hour in Asia/Kolkata. All selected records fall on this one date, so the split is by hour and person rather than by day. ' + note + '</p></div><div style="padding:0 12px">' + svg + '</div><div class="legend"><span><i style="background:var(--c-call)"></i>Calls (started_at)</span><span><i style="background:var(--c-meet)"></i>Meetings (scheduled start)</span></div></section>';
  }

    s += '<section class="card"><div class="pad"><h2>Replay controls</h2><p class="small muted" style="margin:4px 0 10px">Current state: <b class="mono">' + m.records + '</b> distinct records · <b class="mono">' + m.textAll + '</b> with usable text' + (m07 ? ' · M07 at revision <b class="mono">' + m07.rec.applied_revision + '</b>, routes: ' + routeChips(m07) : '') + '</p>';

    s += '<section class="card" style="margin-top:16px"><div class="pad"><h2>Replay self-test</h2><p class="small muted" style="margin:4px 0 8px">Runs the full replay (import, repeat, correct, update, replay old revision, reload, export) on a throwaway copy. Your saved state is not touched.</p><button class="btn" data-act="selftest">Run replay self-test</button></div>';
    if (ui.selflog) s += '<ul class="steps">' + ui.selflog.map(function (x) { return '<li><span class="chip ' + (x.pass ? 'good' : 'bad') + '">' + (x.pass ? 'PASS' : 'FAIL') + '</span><span><b>' + esc(x.name) + '</b><br><span class="small muted">' + esc(x.detail) + '</span></span></li>'; }).join('') + '</ul>';
