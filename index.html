  // ---------- Method ----------
  function viewMethod() {
    return '<div class="page-title"><h1>Method and limits</h1></div><div class="brief card pad" style="max-width:860px"><ul>' + [
      '<b>Identity.</b> A record is the pair (source_type, source_id). Names, titles, record_ref and file order are never used to match records.',
      '<b>Revisions.</b> The newer revision replaces the whole payload and transcript, nulls included. Same or older revisions are ignored. Manual routes and review marks are stored separately from source fields, so an update never erases them.',
      '<b>Pre-generated vs computed.</b> The analysis text, routes, next steps and the brief narrative were prepared in advance with AI assistance and checked against the transcripts: every cited turn or quote is verified to exist in the source at build time. The app computes everything else live: record counts, coverage, connection rate, routing counts, intake states, the possible-duplicate check, analysis freshness (a hash of the transcript text compared with the text the analysis was prepared against), and the export.',
      '<b>New or changed text.</b> If a record\'s text changes after its analysis was prepared, the analysis is shown as stale and the record moves to "Needs a decision". It is never displayed as if it reflects the new text. Records that gain text with no prepared analysis are routed to Capture gap and flagged.',
      '<b>Stored labels.</b> is_connected, is_conversation and observed_outcome are earlier-system outputs. They are shown as source-reported and compared with the transcript where one exists.',
      '<b>Meeting people.</b> The organiser is the calendar owner. Speakers in transcripts are local labels (Team member A) with no mapping to organisers, so coaching is attributed to the speaker label, not to a person.',
      '<b>Dates.</b> All activity is on 21 August 2026 in Asia/Kolkata. The deliveries arrived on 22 August; that is a different concept. "Monday" in a transcript is read as 24 August 2026 (21 Aug is a Friday).',
      '<b>No invented money.</b> No pipeline value, win probability or account join is shown. Prices in the analysis are amounts the speakers quoted. Opportunity signal (none, weak, moderate) is a reading of the conversation only.',
      '<b>Possible duplicates.</b> Two meetings with the same account name and overlapping times (M04 and M13) are flagged as related, not merged. Both stay counted until a person decides.',
      '<b>Limits.</b> Only 18 of 44 records have text, so nothing here ranks reps. 20 calls are dial metadata only. Opening the page for the first time loads the demo data into this browser only; nothing is sent anywhere.'
    ].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>';
  }

  // ---------- Drawer ----------
  function evBtn(rec, e) {
    var label = rec.source_type === 'meeting' ? 'turn ' + e : '“' + (e.length > 46 ? e.slice(0, 44) + '…' : e) + '”';
    return '<button class="ev" data-act="ev" data-ev="' + esc(encodeURIComponent(JSON.stringify(e))) + '" title="Show in transcript">' + esc(label) + '</button>';
  }
  function evs(rec, list) { return (list || []).map(function (e) { return evBtn(rec, e); }).join(''); }

  function drawer() {
    if (!ui.open || !state.records[ui.open]) return '';
    var d = R.derive(state, ANALYSES, ui.open), rec = d.rec, p = rec.payload;
    var s = '<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Record ' + esc(d.ref) + '"><div class="d-head"><button class="btn sm close" data-act="close" aria-label="Close">Close</button>';
    s += '<div class="small muted mono">' + esc(d.ref) + ' · ' + rec.source_type + ' · ' + esc(rec.source_id) + '</div><h2>' + esc(titleOf(d)) + '</h2>';
    s += '<div class="d-meta"><span>' + d.when.date + ' ' + d.when.hm + ' IST</span><span>' + (rec.source_type === 'call' ? 'Rep' : 'Organiser') + ': ' + esc(personLabel(d.person)) + '</span><span>Source revision ' + rec.applied_revision + ' (' + esc(rec.batch_id) + ')</span>' + stateChip(d) + textChip(d) + '</div>';
    s += '<div class="tabs" role="tablist">' + [['analysis', 'Analysis'], ['transcript', 'Transcript'], ['source', 'Source fields']].map(function (t) { return '<button role="tab" aria-selected="' + (ui.tab === t[0]) + '" data-act="tab" data-id="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div></div><div class="d-body">';
    s += routeBox(d);
    if (ui.tab === 'analysis') s += analysisTab(d);
    else if (ui.tab === 'transcript') s += transcriptTab(d);
    else s += sourceTab(d);
    return s + '</div></aside>';
  }

  function routeBox(d) {
    var edit = ui.edit && ui.edit.key === d.key ? ui.edit : { key: d.key, routes: d.effective.slice(), note: d.override ? d.override.note : '' };
    var s = '<section class="card routebox"><h2>Routing</h2>';
    s += '<div class="small"><b>Suggested</b> (' + (d.basis === 'rule' ? 'rule on source metadata' : d.basis === 'analysis' ? 'prepared analysis, matches current text' : 'prepared analysis for older text') + '): <span class="chips" style="display:inline-flex">' + d.suggested.map(function (r) { return rChip(r); }).join('') + '</span></div>';
    s += '<div class="small"><b>In effect:</b> ' + routeChips(d) + (d.override ? ' <span class="muted">set ' + esc(d.override.set_at.slice(0, 16).replace('T', ' ')) + ' UTC' + (d.override.note ? ' · ' + esc(d.override.note) : '') + '</span>' : '') + '</div>';
    if (d.differs) s += '<div class="banner warn" style="margin:0"><span>Your manual route differs from the current suggestion. The manual route stays in effect until you reset it.</span></div>';
    if (d.analysis) (d.suggested).forEach(function (r) { if (d.analysis.route_reasons[r]) s += '<div class="small muted">Why ' + esc(R.ROUTES[r].label) + ': ' + esc(d.analysis.route_reasons[r]) + '</div>'; });
    s += '<div class="routeedit">' + R.ROUTE_ORDER.map(function (r) { return '<label><input type="checkbox" id="ov-' + r + '" data-act="ov-toggle" data-id="' + r + '"' + (edit.routes.indexOf(r) >= 0 ? ' checked' : '') + '> ' + rChip(r) + '</label>'; }).join('') + '</div>';
    s += '<div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="ov-note" placeholder="Why are you changing the route? (optional)" value="' + esc(edit.note) + '" data-act="ov-note"><button class="btn primary" data-act="ov-save">Save correction</button>' + (d.override ? '<button class="btn" data-act="ov-reset">Reset to suggestion</button>' : '') + '</div></section>';
    return s;
  }

  function analysisTab(d) {
    var a = d.analysis, rec = d.rec, s = '';
    if (!d.usable) {
      s += '<section class="card pad sec"><h3>No analysis, by design</h3><p>' + esc(d.text.label) + '. ' + intakeNote(d) + '</p>';
      if (d.reviewReason) s += '<p style="margin-top:8px"><b>Needs a person:</b> ' + esc(d.reviewReason) + '</p>';
      s += '</section>';
      if (d.related.length) s += relatedBox(d);
      return s + markBtn(d);
    }
    if (d.freshness === 'stale') s += '<div class="banner bad"><span><b>Stale analysis.</b> The source text changed after this analysis was prepared. Treat the content below as describing the earlier text until it is re-reviewed.</span></div>';
    else if (a) s += '<div class="banner" style="margin:0"><span class="small">Analysis prepared against this exact text (hash <span class="mono">' + esc(d.textHash) + '</span>, source revision ' + a.analysed_revision + '). Pre-generated with AI assistance; evidence references are verified in the source.</span></div>';
    if (!a) return s + '<section class="card pad"><p>Text is available but no analysis was prepared for it. Review it in the Transcript tab.</p></section>' + markBtn(d);
    s += '<section class="card pad sec"><h3>What happened and why it matters</h3><p>' + esc(a.headline) + '</p><div class="chips" style="margin-top:8px"><span class="chip plain">' + esc(a.type) + '</span>' + (a.signal && a.signal !== 'n/a' ? '<span class="chip plain">Opportunity signal: ' + esc(a.signal) + ' (conversation only)</span>' : '') + '</div></section>';
    if (a.label_check) s += '<section class="card pad sec"><h3>Stored label vs the text</h3><p><span class="mono">' + esc(a.label_check.stored) + '</span> <span class="chip ' + (a.label_check.verdict === 'agrees' ? 'good' : a.label_check.verdict === 'partly' ? 'warn' : 'bad') + '">' + esc(a.label_check.verdict) + '</span> ' + esc(a.label_check.note) + '</p></section>';
    d.effective.forEach(function (r) {
      var o = a.out[r];
      s += '<section class="card pad sec"><h3>' + rChip(r) + '</h3>';
      if (!o) { s += '<p class="muted">No analysis was prepared for this route. The routes this record was analysed for were: ' + a.route_ids.map(function (x) { return R.ROUTES[x].label; }).join(', ') + '. The export writes a stub for this route.</p></section>'; return; }
      s += '<p style="margin-bottom:8px">' + esc(o.summary) + '</p><ul>' + o.points.map(function (pt) { return '<li>' + (pt.k === 'keep' ? '<span class="tag keep">keep</span>' : pt.k === 'change' ? '<span class="tag change">change</span>' : '') + esc(pt.t) + ' ' + evs(rec, pt.ev) + '</li>'; }).join('') + '</ul></section>';
    });
    if (a.next && a.next.length && d.effective.some(function (r) { return r !== 'coaching' && r !== 'log' && r !== 'gap'; })) {
      s += '<section class="card sec"><div class="pad"><h3>Next steps and who owns them</h3></div><div class="tablewrap"><table><thead><tr><th>Action</th><th>Owner</th><th>When</th><th>Evidence</th></tr></thead><tbody>' + a.next.map(function (n) { return '<tr><td>' + esc(n.a) + '</td><td>' + esc(n.owner) + '</td><td>' + esc(n.when) + '</td><td>' + evs(rec, n.ev) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
    }
    if (!a.next.length) s += '<section class="card pad sec"><h3>Next steps</h3><p class="muted">None supported by the conversation.</p></section>';
    s += '<section class="card pad sec"><h3>What the evidence does not establish</h3><ul>' + a.not_established.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
    if (d.reviewReason) s += '<section class="card pad sec"><h3>Needs a person</h3><p>' + esc(d.reviewReason) + '</p></section>';
    if (d.related.length) s += relatedBox(d);
    return s + markBtn(d);
  }
  function relatedBox(d) {
    return '<section class="card pad sec"><h3>Possibly related records</h3><ul>' + d.related.map(function (x) { return '<li><button class="linkbtn" data-act="open" data-key="' + esc(x.key) + '">' + esc(x.ref) + '</button> ' + esc(x.why) + '</li>'; }).join('') + '</ul></section>';
  }
  function markBtn(d) {
    if (d.reviewState === 'needs-decision' || d.reviewState === 'stale' || d.reviewState === 'awaiting-text') return '<div><button class="btn" data-act="mark-reviewed">Mark reviewed for revision ' + d.rec.applied_revision + '</button></div>';
    if (d.reviewed) return '<div class="small muted">Reviewed at source revision ' + d.rec.applied_revision + '.</div>';
    return '';
  }
  function intakeNote(d) {
    var id = d.text.id;
    if (id === 'no-transcript') return 'The package supplies no transcript for this call, only dial metadata. That does not show that nothing was said, so no summary is invented. It counts as activity in the dashboard.';
    if (id === 'silent') return 'The recording exists but the source reports that nobody spoke. Attendance is unknown.';
    if (id === 'pending') return 'The source says a transcript exists but this delivery did not include it. The record is routed to Capture gap until the update arrives. The analysis is not shown until it does.';
    if (id === 'not-captured') return 'No recording exists. A cancelled notetaker does not mean the meeting was cancelled.';
    return 'Transcript unavailable.';
  }
  function transcriptTab(d) {
    var rec = d.rec;
    if (!d.usable) return '<section class="card pad"><p class="muted">' + esc(d.text.label) + '. ' + esc((rec.transcript_payload && rec.transcript_payload.unavailable_reason) || intakeNote(d)) + '</p></section>';
    var s = '<section class="card pad">';
    if (rec.source_type === 'meeting') {
      var hl = ui.hl && ui.hl.key === d.key ? ui.hl.ev : null;
      s += rec.transcript_payload.turns.map(function (t, i) { return '<div class="turn' + (hl === i + 1 ? ' hl' : '') + '" id="turn-' + (i + 1) + '"><span class="n">' + (i + 1) + '</span><div><div class="who">' + esc(t.speaker) + ' · ' + esc(t.timecode) + '</div>' + esc(t.text) + '</div></div>'; }).join('');
    } else {
      var txt = rec.payload.transcript, q = ui.hl && ui.hl.key === d.key ? ui.hl.ev : null, idx = q ? txt.indexOf(q) : -1;
      s += '<div class="callt">' + (idx >= 0 ? esc(txt.slice(0, idx)) + '<mark id="hl-mark">' + esc(q) + '</mark>' + esc(txt.slice(idx + q.length)) : esc(txt)) + '</div><p class="small muted" style="margin-top:10px">Phone-call text has no trustworthy turn timing, so passages are cited by exact quote.</p>';
    }
    return s + '</section>';
  }
  var LABELLED = { is_connected: 1, is_conversation: 1, observed_outcome: 1, classification_status: 1, summary_status: 1, is_campaign_call: 1, first_dial_ever: 1, first_connect_ever: 1, prior_dials_ever: 1, prior_connects_ever: 1 };
  function sourceTab(d) {
    var rec = d.rec, p = rec.payload;
    var s = '<section class="card"><div class="kv"><div>applied revision</div><div>' + rec.applied_revision + ' (batch ' + esc(rec.batch_id) + ')' + (rec.prev_revision ? ', replaced revision ' + rec.prev_revision : '') + '</div><div>first seen</div><div>' + esc(rec.first_seen_batch) + '</div>';
    Object.keys(p).filter(function (k) { return k !== 'transcript'; }).forEach(function (k) {
      var v = p[k]; s += '<div>' + esc(k) + '</div><div>' + (v === null ? '<span class="faint">null (not supplied)</span>' : esc(String(v))) + (LABELLED[k] ? ' <span class="chip plain">source-reported</span>' : '') + '</div>';
    });
    if (rec.transcript_payload) s += '<div>turns</div><div>' + rec.transcript_payload.turns.length + (rec.transcript_payload.unavailable_reason ? ' · ' + esc(rec.transcript_payload.unavailable_reason) : '') + '</div>';
    return s + '</div></section>';
  }

  // ---------- shell ----------
  function render() {
    var all = state.records ? Object.keys(state.records).length : 0;
    var html = '<div class="top"><div class="top-in"><div class="brand"><b>Revenue Intelligence Inbox</b><span>SpendNest · call and meeting review</span></div><nav aria-label="Views">' + VIEWS.map(function (v) { return '<button data-act="nav" data-id="' + v[0] + '"' + (ui.view === v[0] ? ' aria-current="page"' : '') + '>' + v[1] + '</button>'; }).join('') + '</nav></div></div>';
    var view = { today: viewToday, brief: viewBrief, inbox: viewInbox, routes: viewRoutes, data: viewData, method: viewMethod }[ui.view]();
    html += '<main class="wrap">' + view + '</main>' + drawer() + (ui.toast ? '<div class="toast" role="status">' + esc(ui.toast) + '</div>' : '');
    var fo = document.activeElement && document.activeElement.id, selS = null;
    if (fo && document.activeElement.selectionStart !== undefined) selS = document.activeElement.selectionStart;
    var st = document.querySelector('.d-body') ? document.querySelector('.d-body').scrollTop : 0;
    document.getElementById('rii-root').innerHTML = html;
    if (fo) { var el = document.getElementById(fo); if (el) { el.focus(); if (selS !== null && el.setSelectionRange && el.type !== 'checkbox') try { el.setSelectionRange(selS, selS); } catch (e) { } } }
    var db = document.querySelector('.d-body');
    if (db) { db.scrollTop = ui.scrollReset ? 0 : st; }
    if (ui.hl && ui.hl.scroll) { var target = document.querySelector('.turn.hl') || document.getElementById('hl-mark'); if (target) target.scrollIntoView({ block: 'center' }); ui.hl.scroll = false; }
    ui.scrollReset = false;
  }

  function download() {
    var ex = R.buildExport(state, ANALYSES, BRIEF, { generatedAt: new Date().toISOString() });
    var blob = new Blob([R.zip(ex.files, 'rii-export')], { type: 'application/zip' });
    function fallback() { try { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rii-export.zip'; document.body.appendChild(a); a.click(); a.remove(); toast('Export downloaded'); } catch (e) { toast('Download is blocked here. Open the standalone file or copy files from the preview.'); } }
    var cl = window.claude && window.claude.use;
    if (!cl) return fallback();
    window.claude.use('downloads').then(function (dl) {
      if (!dl) return fallback();
      return dl.save({ filename: 'rii-export.zip', data: blob }).then(function () { toast('Export saved'); }, function (e) { if (e && e.code === 'declined') return; fallback(); });
    }, fallback);
  }

  function doImport(batch, label) {
    var e = R.importBatch(state, batch, label); save();
    toast(label + ': ' + e.added + ' added, ' + e.updated + ' updated, ' + (e.ignored_same + e.ignored_older) + ' ignored' + (e.rejected ? ', ' + e.rejected + ' rejected' : '') + '. ' + Object.keys(state.records).length + ' distinct records.');
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act === 'ov-note' || act === 'ov-toggle') { if (act === 'ov-note') return; var k = ui.open; if (!ui.edit || ui.edit.key !== k) { var dd = R.derive(state, ANALYSES, k); ui.edit = { key: k, routes: dd.effective.slice(), note: dd.override ? dd.override.note : '' }; } var i = ui.edit.routes.indexOf(id); if (t.checked && i < 0) ui.edit.routes.push(id); if (!t.checked && i >= 0) ui.edit.routes.splice(i, 1); return; }
    if (act === 'nav') { ui.view = id; ui.open = null; location.hash = id; }
    else if (act === 'open') { ui.open = t.getAttribute('data-key'); ui.tab = 'analysis'; ui.hl = null; ui.edit = null; ui.scrollReset = true; }
    else if (act === 'close') { ui.open = null; ui.edit = null; }
    else if (act === 'tab') { ui.tab = id; ui.scrollReset = true; }
    else if (act === 'person') { ui.person = id; ui.view = 'inbox'; location.hash = 'inbox'; }
    else if (act === 'route-filter') { ui.route = id; ui.view = 'inbox'; location.hash = 'inbox'; }
    else if (act === 'clear-filters') { ui.person = ui.type = ui.route = ui.review = ui.q = ''; }
    else if (act === 'dismiss-first') firstRun = false;
    else if (act === 'ev') { var e2 = JSON.parse(decodeURIComponent(t.getAttribute('data-ev'))); ui.hl = { key: ui.open, ev: e2, scroll: true }; ui.tab = 'transcript'; }
    else if (act === 'ov-save') {
      var key = ui.open, ed = ui.edit && ui.edit.key === key ? ui.edit : null, dv = R.derive(state, ANALYSES, key);
      var routes = ed ? ed.routes : dv.effective, note = document.getElementById('ov-note') ? document.getElementById('ov-note').value : '';
      if (!routes.length) { toast('Choose at least one route.'); return; }
      R.setOverride(state, key, R.ROUTE_ORDER.filter(function (r) { return routes.indexOf(r) >= 0; }), note); save(); ui.edit = null; toast('Manual route saved for ' + dv.ref);
    }
    else if (act === 'ov-reset') { R.clearOverride(state, ui.open); save(); ui.edit = null; toast('Reset to the suggested route'); }
    else if (act === 'mark-reviewed') { R.markReviewed(state, ui.open); save(); toast('Marked reviewed'); }
    else if (act === 'imp-initial') { doImport(R.clone(INITIAL), 'initial-001 (rev 1)'); }
    else if (act === 'imp-shuffled') { var b = R.clone(INITIAL); b.records.reverse(); doImport(b, 'initial-001 (rev 1, reversed order)'); }
    else if (act === 'imp-update') { doImport(R.clone(UPDATE), 'update-002 (rev 2)'); }
    else if (act === 'imp-initial-again') { doImport(R.clone(INITIAL), 'initial-001 (rev 1, replayed after update)'); }
    else if (act === 'open-m07') { var ks = Object.keys(state.records).filter(function (k) { return state.records[k].record_ref === 'M07'; }); if (!ks.length) { toast('Import the initial delivery first.'); return; } ui.open = ks[0]; ui.tab = 'analysis'; ui.scrollReset = true; }
    else if (act === 'demo') { state = R.newState(); R.importBatch(state, R.clone(INITIAL), 'initial-001 (demo load)'); R.importBatch(state, R.clone(UPDATE), 'update-002 (demo load)'); save(); toast('Demo loaded: 44 records at their latest revision'); }
    else if (act === 'reset') { state = R.newState(); save(); ui.open = null; ui.selflog = null; ui.person = ui.type = ui.route = ui.review = ui.q = ''; firstRun = false; toast('Clean start. Nothing imported.'); }
    else if (act === 'selftest') { ui.selflog = R.replaySelfTest(R.clone(INITIAL), R.clone(UPDATE), ANALYSES, BRIEF); }
    else if (act === 'download') { download(); return; }
    else if (act === 'file') { ui.selFile = t.getAttribute('data-path'); }
    else return;
    render();
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'file-in' && t.files && t.files[0]) {
      var f = t.files[0], rd = new FileReader();
      rd.onload = function () { try { doImport(JSON.parse(rd.result), f.name); } catch (e) { toast('Could not read ' + f.name + ': not valid JSON.'); } };
      rd.readAsText(f); return;
    }
    var fk = t.getAttribute && t.getAttribute('data-f');
    if (fk && t.tagName === 'SELECT') { ui[fk] = t.value; render(); }
    if (t.getAttribute && t.getAttribute('data-act') === 'ov-toggle') { var id = t.getAttribute('data-id'), k = ui.open; if (!ui.edit || ui.edit.key !== k) { var dd = R.derive(state, ANALYSES, k); ui.edit = { key: k, routes: dd.effective.slice(), note: dd.override ? dd.override.note : '' }; } var i = ui.edit.routes.indexOf(id); if (t.checked && i < 0) ui.edit.routes.push(id); if (!t.checked && i >= 0) ui.edit.routes.splice(i, 1); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'f-q') { ui.q = t.value; render(); }
    if (t.id === 'ov-note') { var k = ui.open; if (!ui.edit || ui.edit.key !== k) { var dd = R.derive(state, ANALYSES, k); ui.edit = { key: k, routes: dd.effective.slice(), note: '' }; } ui.edit.note = t.value; }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.open) { ui.open = null; render(); } });
  window.addEventListener('hashchange', function () { var h2 = location.hash.replace('#', ''); if (VIEWS.some(function (v) { return v[0] === h2; })) { ui.view = h2; render(); } });
  window.__rii = { get state() { return state; }, R: R };
  render();
})();

</script>
</body></html>
